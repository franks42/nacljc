name: ci

# Every job only calls bb tasks: bb.edn is the single definition of each
# check, locally and here.
#
#   lint   clj-kondo and cljfmt on every Clojure file
#   macos  Homebrew libsodium: the suite on bb, the JVM and nbb; library
#          loading; libsodium.js on Node (WASM); the suite against the
#          installed jar
#   linux  libsodium 1.0.22 built from a checksum-pinned tarball (Ubuntu's
#          package is 1.0.18, no HKDF) and the dynamically linked bb (the
#          static build cannot load native libraries); the same checks, plus
#          Scittle + libsodium.js in the runner's headless Chrome
#          (Playwright's browser download stalled on both runner OSes).

on:
  push:
    branches: [main]
  pull_request:

env:
  LIBSODIUM_VERSION: 1.0.22
  # SHA-256 of libsodium-1.0.22.tar.gz, identical from download.libsodium.org
  # and the GitHub release (checked 2026-09-23).
  LIBSODIUM_SHA256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349
  # babashka.ffi on Linux needs the DYNAMICALLY linked bb: the static (musl)
  # build, which setup-clojure installs on Linux, cannot load shared libraries.
  BB_VERSION: 1.13.224
  # SHA-256 of babashka-1.13.224-linux-amd64.tar.gz (matches the release's .sha256)
  BB_LINUX_SHA256: 9640da489dbbeeb4830cd87f22e44e26af0f8313160c491c61d9c245e86206f6
  NBB_VERSION: 1.6.213

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          clj-kondo: 'latest'
          cljfmt: 'latest'
      - run: bb lint
      - run: bb fmt

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 'latest'
          cli: 'latest'

      - uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Install libsodium (Homebrew) and nbb
        run: |
          brew install libsodium
          brew list --versions libsodium
          npm install -g "nbb@${NBB_VERSION}"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Prefetch deps
        run: clojure -P

      - name: Suite on babashka
        run: bb test:bb
      - name: Suite on the JVM
        run: bb test:jvm
      - name: Suite on nbb
        run: bb test:nbb
      - name: Library loading (bb, nbb, JVM)
        run: bb test:loading

      - name: libsodium.js (WASM) on Node
        run: |
          (cd test/wasm && npm ci)
          bb test:wasm

      - name: Suite against the installed jar (JVM, bb, nbb)
        run: bb test:jar

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          cli: 'latest'

      - uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Install the dynamically linked bb ${{ env.BB_VERSION }} (checksum-pinned)
        run: |
          curl -fsSL -o bb.tar.gz \
            "https://github.com/babashka/babashka/releases/download/v${BB_VERSION}/babashka-${BB_VERSION}-linux-amd64.tar.gz"
          echo "${BB_LINUX_SHA256}  bb.tar.gz" | sha256sum --check --strict
          sudo tar xzf bb.tar.gz -C /usr/local/bin bb
          file "$(command -v bb)"
          file "$(command -v bb)" | grep -q "dynamically linked" \
            || { echo "::error::bb must be dynamically linked for babashka.ffi"; exit 1; }
          bb --version

      - name: Build libsodium ${{ env.LIBSODIUM_VERSION }} from source (checksum-pinned)
        run: |
          curl -fsSL -o libsodium.tar.gz \
            "https://download.libsodium.org/libsodium/releases/libsodium-${LIBSODIUM_VERSION}.tar.gz"
          echo "${LIBSODIUM_SHA256}  libsodium.tar.gz" | sha256sum --check --strict
          tar xzf libsodium.tar.gz
          cd "libsodium-${LIBSODIUM_VERSION}"
          ./configure --prefix=/usr/local --disable-dependency-tracking
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          ldconfig -p | grep libsodium

      - name: Install nbb
        run: npm install -g "nbb@${NBB_VERSION}"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Prefetch deps
        run: clojure -P

      - name: Suite on babashka
        run: bb test:bb
      - name: Suite on the JVM
        run: bb test:jvm
      - name: Suite on nbb
        run: bb test:nbb
      - name: Library loading (bb, nbb, JVM)
        run: bb test:loading
      - name: Suite against the installed jar (JVM, bb, nbb)
        run: bb test:jar

      - name: libsodium.js (WASM) on Node
        run: |
          (cd test/wasm && npm ci)
          bb test:wasm

      # The runner's preinstalled Chrome: Playwright's own browser download
      # stalled at 0% (and, on macOS, after 100%) on 2026-09-23.
      - name: Scittle + libsodium.js in headless Chrome
        timeout-minutes: 10
        run: |
          (cd test/browser && npm ci)
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          "$CHROME_PATH" --version
          bb test:browser
